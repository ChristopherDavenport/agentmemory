name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.26 is the floor the sqlite module declares (modernc.org/sqlite
        # v1.62.0 needs it), and every job here builds every module; the
        # root's 1.25 floor is the root job's. stable is the current
        # release.
        go: ["1.26.x", "stable"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          # Nested modules have their own go.sum; cache all of them.
          cache-dependency-path: |
            go.sum
            **/go.sum
      - name: Build
        run: make build
      - name: Root module depends on openresponses, agenttool and the standard library only
        run: make deps
      - name: Every first-party require is replaced with the tree
        run: make replaces
      - name: Vet (library and nested modules)
        run: make vet
      - name: Test (library and nested modules)
        run: make test

  # The root module declares go 1.25, below the sqlite module's 1.26, so
  # it is tested on its own floor, without the nested modules.
  root:
    name: Test root module (Go 1.25.x)
    runs-on: ubuntu-latest
    env:
      # Build with 1.25 itself, not a newer toolchain a go.mod asks for.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache-dependency-path: go.sum
      - name: Build, vet and test the root module alone
        run: make build vet test SUBMODULES=

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Not stable: staticcheck 2026.2.1 cannot read go1.27.2's export
          # data (dominikh/go-tools#1832). Back to stable once a release
          # with the fix is out.
          go-version: "1.26.x"
          # The runner's cached 1.26 can lag a security release, which
          # govulncheck then reports.
          check-latest: true
          cache-dependency-path: |
            go.sum
            **/go.sum
      - name: Check formatting
        run: make fmt
      - name: Check go.mod and go.sum are tidy in every module
        run: make tidy-check
      - name: staticcheck
        run: make lint
      - name: govulncheck
        run: make vuln

  # Single required status check for branch protection; it fails if any job
  # above failed, was cancelled or was skipped.
  checks:
    name: Checks
    if: always()
    needs: [test, root, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
